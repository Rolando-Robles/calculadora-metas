# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Minimum instances to keep running (0 to scale to zero when idle)
  minInstances: 0
  # Concurrent requests per instance
  concurrency: 80
  # CPU and memory configuration
  cpu: 1
  memoryMiB: 512

# NOTA: Las variables de entorno se configuran en Firebase Console
# App Hosting > Backend > Entorno > Variables de entorno
# NO se declaran en este archivo
